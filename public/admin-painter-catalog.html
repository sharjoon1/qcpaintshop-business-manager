<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F3A5F">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Painter Catalog Curation — Quality Colours Manager</title>
    <script src="/js/auth-helper.js?v=7101c516"></script>
    <script src="/js/pages/admin-painter-catalog-authguard.js?v=1"></script>
    <link rel="stylesheet" href="/css/tailwind.css?v=849f1b5c">
    <link rel="stylesheet" href="/css/design-system.css?v=16beaa3b">
    <script src="/universal-nav-loader.js?v=6b4a6dbe"></script>
</head>
<body class="bg-gray-50 sidebar-collapsed" data-page="painters">
    <div class="container mx-auto p-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
            <div>
                <h2 class="text-3xl font-bold text-gray-800">Painter Catalog Curation</h2>
                <p class="text-sm text-gray-500 mt-1">Only the products you show here appear in the painter app. Everything starts hidden — pick per brand.</p>
            </div>
            <div class="flex gap-2">
                <button id="btnHideAll" class="px-4 py-2 rounded-lg border text-sm bg-white font-semibold hover:bg-gray-50">Hide All Products</button>
                <button id="btnRefresh" class="px-4 py-2 rounded-lg border text-sm bg-white font-semibold hover:bg-gray-50">↻ Refresh</button>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex flex-wrap items-center gap-3">
            <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Filter</label>
            <select id="brandFilter" class="border rounded-lg px-3 py-2 text-sm"></select>
            <select id="catFilter" class="border rounded-lg px-3 py-2 text-sm">
                <option value="">All categories</option>
            </select>
            <span class="text-xs text-gray-500" id="prodCount"></span>
            <button id="btnShowBrand" class="ml-auto px-3 py-2 rounded-lg border text-xs bg-white font-semibold hover:bg-gray-50">Show all in filter</button>
        </div>

        <!-- Save bar -->
        <div id="saveBar" class="hidden sticky top-2 z-10 mb-4 bg-[#0F3A5F] text-white rounded-xl px-4 py-3 flex items-center justify-between shadow-lg">
            <span id="saveMsg" class="text-sm font-medium">Unsaved changes</span>
            <button id="btnSave" class="px-5 py-2 rounded-lg bg-white text-[#0F3A5F] text-sm font-bold hover:bg-gray-100">Save Changes</button>
        </div>

        <!-- Brands -->
        <div class="bg-white rounded-xl shadow-sm p-5 mb-4">
            <h3 class="text-lg font-bold text-gray-800 mb-3">Brands</h3>
            <div id="brandGrid" class="flex gap-2 overflow-x-auto pb-2" style="-webkit-overflow-scrolling: touch;scrollbar-width: thin;"></div>
        </div>

        <!-- Products of selected brand -->
        <div class="bg-white rounded-xl shadow-sm p-5">
            <div class="flex flex-wrap items-center gap-3 mb-3">
                <h3 class="text-lg font-bold text-gray-800">Products</h3>
                <span class="text-xs text-gray-500"></span>
            </div>
            <div id="prodEmpty" class="hidden text-sm text-slate-500 py-8 text-center">No products. Pick a brand above.</div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="text-slate-500 border-b">
                        <tr>
                            <th class="text-left p-2 w-10">Show</th>
                            <th class="text-left p-2">Product</th>
                            <th class="text-left p-2">Category</th>
                            <th class="text-right p-2">Variants</th>
                            <th class="text-left p-2">Image</th>
                        </tr>
                    </thead>
                    <tbody id="prodBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/pages/admin-painter-catalog.js?v=4"></script>
</body>
</html>
