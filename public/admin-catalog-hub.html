<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalog Hub — Quality Colours Manager</title>
<link rel="stylesheet" href="/css/tailwind.css?v=849f1b5c">
<link rel="stylesheet" href="/css/design-system.css">
<link rel="stylesheet" href="/css/qc-ui.css">
<style>
:root{--hub-accent:#0F3A5F}
.qc-hub-tabs{display:flex;gap:.25rem;overflow-x:auto;padding:.5rem 0;border-bottom:1px solid #e5e7eb}
.qc-hub-tab{white-space:nowrap;padding:.6rem 1rem;border-radius:8px 8px 0 0;font-weight:600;font-size:.85rem;color:#64748b;border:1px solid transparent;border-bottom:none;cursor:pointer;background:#f8fafc}
.qc-hub-tab.active{background:#fff;color:var(--hub-accent);border-color:#e5e7eb}
.qc-hub-panel{display:none}.qc-hub-panel.active{display:block}
.qc-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:1rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-page="products" class="bg-gray-50">
<div id="universal-nav-placeholder"></div>
<div id="subnav-placeholder"></div>
<main class="max-w-7xl mx-auto px-4 py-6">
  <header class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div><h1 class="text-xl font-bold text-slate-900">Catalog Hub</h1><p class="text-sm text-slate-500">Products · Brands · Categories · Item Master</p></div>
    <div class="flex gap-2"><button id="btn-refresh" class="px-3 py-2 rounded-lg border bg-white text-sm">Refresh</button><a href="/admin-products.html" class="px-3 py-2 rounded-lg text-white text-sm" style="background:var(--gradient-primary)">Products</a></div>
  </header>
  <div class="qc-hub-tabs" role="tablist">
    <button class="qc-hub-tab active" data-tab="products" role="tab" aria-selected="true">Products</button>
    <button class="qc-hub-tab" data-tab="brands" role="tab">Brands</button>
    <button class="qc-hub-tab" data-tab="categories" role="tab">Categories</button>
    <button class="qc-hub-tab" data-tab="master" role="tab">Item Master</button>
    <button class="qc-hub-tab" data-tab="pending" role="tab">Pending Approval</button>
  </div>

  <section id="panel-products" class="qc-hub-panel active">
    <div class="qc-card mt-4">
      <div class="flex gap-2 mb-3"><input id="prod-q" placeholder="Search products…" class="border rounded-lg px-3 py-2 text-sm w-64"><button id="btn-prod" class="px-3 py-2 rounded-lg text-white text-sm" style="background:#0F3A5F">Search</button><span id="prod-status" class="text-sm text-slate-500 self-center"></span></div>
      <div id="prod-empty" class="hidden text-sm text-slate-500 py-8 text-center">No products.</div>
      <table class="w-full text-sm"><thead class="text-slate-500"><tr><th class="text-left p-2">Name</th><th class="text-left p-2">Brand</th><th class="text-left p-2">Category</th></tr></thead><tbody id="prod-body"></tbody></table>
    </div>
  </section>
  <section id="panel-brands" class="qc-hub-panel">
    <div class="qc-card mt-4">
      <div class="flex gap-2 mb-3"><button id="btn-brands" class="px-3 py-2 rounded-lg text-white text-sm" style="background:#0F3A5F">Load brands</button><span id="brands-status" class="text-sm text-slate-500 self-center"></span></div>
      <div id="brands-empty" class="hidden text-sm text-slate-500 py-8 text-center">No brands.</div>
      <table class="w-full text-sm"><thead class="text-slate-500"><tr><th class="text-left p-2">Brand</th><th class="text-left p-2">Products</th></tr></thead><tbody id="brands-body"></tbody></table>
    </div>
  </section>
  <section id="panel-categories" class="qc-hub-panel">
    <div class="qc-card mt-4">
      <div class="flex gap-2 mb-3"><button id="btn-cats" class="px-3 py-2 rounded-lg text-white text-sm" style="background:#0F3A5F">Load categories</button><span id="cats-status" class="text-sm text-slate-500 self-center"></span></div>
      <div id="cats-empty" class="hidden text-sm text-slate-500 py-8 text-center">No categories.</div>
      <table class="w-full text-sm"><thead class="text-slate-500"><tr><th class="text-left p-2">Category</th><th class="text-left p-2">Products</th></tr></thead><tbody id="cats-body"></tbody></table>
    </div>
  </section>
  <section id="panel-master" class="qc-hub-panel">
    <div class="qc-card mt-4">
      <div class="flex gap-2 mb-3"><input id="master-q" placeholder="Search item master…" class="border rounded-lg px-3 py-2 text-sm w-64"><button id="btn-master" class="px-3 py-2 rounded-lg text-white text-sm" style="background:#0F3A5F">Search</button><span id="master-status" class="text-sm text-slate-500 self-center"></span></div>
      <div id="master-empty" class="hidden text-sm text-slate-500 py-8 text-center">No items.</div>
      <table class="w-full text-sm"><thead class="text-slate-500"><tr><th class="text-left p-2">Item</th><th class="text-left p-2">SKU</th><th class="text-right p-2">Rate</th></tr></thead><tbody id="master-body"></tbody></table>
      <a href="/admin-item-master.html" class="inline-block mt-3 text-sm text-blue-600">Open Item Master →</a>
    </div>
  </section>
  <section id="panel-pending" class="qc-hub-panel">
    <div class="qc-card mt-4">
      <div class="flex flex-wrap items-center gap-2 mb-3">
        <select id="pending-status" class="border rounded-lg px-2 py-2 text-sm"><option value="pending">Pending</option><option value="pushed">Pushed</option><option value="rejected">Rejected</option><option value="failed">Failed</option><option value="all">All</option></select>
        <button id="btn-pending" class="px-3 py-2 rounded-lg text-white text-sm" style="background:#0F3A5F">Load</button>
        <button id="btn-new-req" class="ml-auto px-3 py-2 rounded-lg border text-sm bg-white">+ New Request</button>
        <span id="pending-status-txt" class="text-sm text-slate-500"></span>
      </div>
      <div id="pending-empty" class="hidden text-sm text-slate-500 py-8 text-center">No requests.</div>
      <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="text-slate-700 border-b"><tr><th class="text-left p-2">Product</th><th class="text-left p-2">Brand</th><th class="text-left p-2">Pack</th><th class="text-right p-2">DPL</th><th class="text-left p-2">Requester</th><th class="text-left p-2">Status</th><th class="text-right p-2">Action</th></tr></thead><tbody id="pending-body"></tbody></table></div>
    </div>
    <dialog id="dlg-new-req" class="rounded-xl p-0 border shadow-lg" style="max-width:520px;width:96%">
      <form method="dialog" class="p-4">
        <h3 class="font-semibold text-slate-900 mb-3">New Product Request (→ Admin Approval → Zoho)</h3>
        <div class="grid grid-cols-2 gap-3 text-sm">
          <label>Brand <input id="req-brand" class="mt-1 border rounded-lg px-2 py-1.5 w-full" required></label>
          <label>Category <input id="req-category" class="mt-1 border rounded-lg px-2 py-1.5 w-full" placeholder="e.g. INTERIOR EMULSION" required></label>
          <label>Category Code <input id="req-catcode" class="mt-1 border rounded-lg px-2 py-1.5 w-full" placeholder="IE" required></label>
          <label>Pack Size <input id="req-pack" class="mt-1 border rounded-lg px-2 py-1.5 w-full" placeholder="10 L" required></label>
          <label>Product Name <input id="req-pname" class="mt-1 border rounded-lg px-2 py-1.5 w-full col-span-2" required></label>
          <label>Base <input id="req-base" class="mt-1 border rounded-lg px-2 py-1.5 w-full" placeholder="optional"></label>
          <label>Color <input id="req-color" class="mt-1 border rounded-lg px-2 py-1.5 w-full" placeholder="optional"></label>
          <label>DPL <input id="req-dpl" type="number" step="0.01" class="mt-1 border rounded-lg px-2 py-1.5 w-full" required></label>
          <label>Unit <input id="req-unit" class="mt-1 border rounded-lg px-2 py-1.5 w-full" value="nos"></label>
          <label class="col-span-2">Description <input id="req-desc" class="mt-1 border rounded-lg px-2 py-1.5 w-full"></label>
        </div>
        <div class="flex justify-end gap-2 mt-4"><button type="button" id="btn-cancel-req" class="px-3 py-2 rounded-lg border text-sm">Cancel</button><button type="submit" id="btn-submit-req" class="px-3 py-2 rounded-lg text-white text-sm" style="background:#0F3A5F">Submit for Approval</button></div>
        <p id="req-msg" class="text-sm text-slate-600 mt-2"></p>
      </form>
    </dialog>
  </section>
</main>
<script src="/universal-nav-loader.js?v=6b4a6dbe"></script>
<script>
const $=s=>document.querySelector(s);
function getAuthHeaders(){const t=localStorage.getItem('auth_token')||localStorage.getItem('token')||'';return t?{Authorization:'Bearer '+t}:{}}
async function apiFetch(url,opts={}){const h={...getAuthHeaders(), ...(opts.headers||{})}; if(opts.body && !(opts.body instanceof FormData) && !h['Content-Type']) h['Content-Type']='application/json'; const r=await fetch(url,{...opts,headers:h}); if(r.status===401){location.href='/login.html'; throw new Error('Auth');} if(!r.ok) throw new Error((await r.text()).slice(0,300)); return r.json();}
function esc(s){const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML;}
function setTab(n){document.querySelectorAll('.qc-hub-tab').forEach(b=>{const on=b.dataset.tab===n; b.classList.toggle('active',on); b.setAttribute('aria-selected',String(on));}); document.querySelectorAll('.qc-hub-panel').forEach(p=> p.classList.toggle('active', p.id==='panel-'+n)); history.replaceState(null,'','#'+n);}
document.querySelectorAll('.qc-hub-tab').forEach(b=> b.addEventListener('click',()=> setTab(b.dataset.tab)));
if(location.hash) setTab(location.hash.slice(1));
async function loadProd(){const q=$('#prod-q').value.trim(); $('#prod-status').textContent='Loading…'; try{const qs=new URLSearchParams(); if(q) qs.set('q',q); qs.set('limit','20'); const j=await apiFetch('/api/products?'+qs.toString()); const rows=j.data||j.products||j.rows||[]; const tb=$('#prod-body'); tb.innerHTML=''; if(!rows.length) $('#prod-empty').classList.remove('hidden'); else $('#prod-empty').classList.add('hidden'); rows.forEach(r=>{const tr=document.createElement('tr'); tr.className='border-t'; tr.innerHTML=`<td class="p-2">${esc(r.name||'')}</td><td class="p-2">${esc(r.brand||r.brand_name||'')}</td><td class="p-2">${esc(r.category||r.category_name||'')}</td>`; tb.appendChild(tr);}); $('#prod-status').textContent=rows.length+' rows';}catch(e){$('#prod-status').textContent=e.message;}}
async function loadBrands(){ $('#brands-status').textContent='Loading…'; try{const j=await apiFetch('/api/brands'); const rows=j.data||j.brands||j.rows||[]; const tb=$('#brands-body'); tb.innerHTML=''; if(!rows.length) $('#brands-empty').classList.remove('hidden'); else $('#brands-empty').classList.add('hidden'); rows.forEach(r=>{const tr=document.createElement('tr'); tr.className='border-t'; tr.innerHTML=`<td class="p-2">${esc(r.name||'')}</td><td class="p-2">${esc(String(r.product_count??''))}</td>`; tb.appendChild(tr);}); $('#brands-status').textContent=rows.length+' rows';}catch(e){$('#brands-status').textContent=e.message;}}
async function loadCats(){ $('#cats-status').textContent='Loading…'; try{const j=await apiFetch('/api/categories'); const rows=j.data||j.categories||j.rows||[]; const tb=$('#cats-body'); tb.innerHTML=''; if(!rows.length) $('#cats-empty').classList.remove('hidden'); else $('#cats-empty').classList.add('hidden'); rows.forEach(r=>{const tr=document.createElement('tr'); tr.className='border-t'; tr.innerHTML=`<td class="p-2">${esc(r.name||'')}</td><td class="p-2">${esc(String(r.product_count??''))}</td>`; tb.appendChild(tr);}); $('#cats-status').textContent=rows.length+' rows';}catch(e){$('#cats-status').textContent=e.message;}}
async function loadMaster(){const q=$('#master-q').value.trim(); $('#master-status').textContent='Loading…'; try{const qs=new URLSearchParams(); if(q) qs.set('search',q); qs.set('limit','20'); const j=await apiFetch('/api/item-master/items?'+qs.toString()); const rows=(j.data&&j.data.items)||j.items||j.rows||[]; const tb=$('#master-body'); tb.innerHTML=''; if(!rows.length) $('#master-empty').classList.remove('hidden'); else $('#master-empty').classList.add('hidden'); rows.forEach(r=>{const tr=document.createElement('tr'); tr.className='border-t'; tr.innerHTML=`<td class="p-2">${esc(r.zoho_item_name||r.item_name||'')}</td><td class="p-2">${esc(r.zoho_sku||r.sku||r.item_sku||'')}</td><td class="p-2 text-right">₹${Number(r.zoho_rate||r.rate||r.price||0).toLocaleString('en-IN')}</td>`; tb.appendChild(tr);}); $('#master-status').textContent=rows.length+' rows';}catch(e){$('#master-status').textContent=e.message;}}
$('#btn-prod').addEventListener('click', loadProd);
$('#btn-brands').addEventListener('click', loadBrands);
$('#btn-cats').addEventListener('click', loadCats);
$('#btn-master').addEventListener('click', loadMaster);
async function loadPending(){ const s=$('#pending-status').value; $('#pending-status-txt').textContent='Loading…'; try{ const j=await apiFetch('/api/item-master/pending-requests?status='+encodeURIComponent(s)+'&limit=50'); const rows=j.data||[]; const canApprove=!!j.canApprove; const tb=$('#pending-body'); tb.innerHTML=''; if(!rows.length) $('#pending-empty').classList.remove('hidden'); else $('#pending-empty').classList.add('hidden'); rows.forEach(r=>{ const tr=document.createElement('tr'); tr.className='border-t'; const isPending=r.status==='pending'; tr.innerHTML=`<td class="p-2">${esc(r.product_name)}</td><td class="p-2">${esc(r.brand)}</td><td class="p-2">${esc(r.pack_size)}</td><td class="p-2 text-right">₹${Number(r.dpl).toLocaleString('en-IN')}</td><td class="p-2">${esc(r.requester_name||'')}</td><td class="p-2"><span class="px-2 py-0.5 rounded text-xs ${r.status==='pending'?'bg-amber-100 text-amber-700':r.status==='pushed'?'bg-emerald-100 text-emerald-700':r.status==='rejected'?'bg-slate-100 text-slate-600':'bg-red-100 text-red-700'}">${esc(r.status)}</span></td><td class="p-2 text-right">${isPending&&canApprove?`<button data-approve="${r.id}" class="px-2 py-1 rounded border text-xs mr-1">Approve → Zoho</button><button data-reject="${r.id}" class="px-2 py-1 rounded border text-xs">Reject</button>`:isPending?'<span class="text-xs text-slate-400">Pending</span>':'<span class="text-xs text-slate-400">—</span>'}</td>`; tb.appendChild(tr); }); $('#pending-status-txt').textContent=rows.length+' rows'; tb.querySelectorAll('[data-approve]').forEach(b=> b.addEventListener('click', async()=>{ b.disabled=true; b.textContent='Pushing…'; try{ await apiFetch('/api/item-master/pending-requests/'+b.dataset.approve+'/approve',{method:'POST'}); loadPending(); }catch(e){ alert(e.message); b.disabled=false; b.textContent='Approve → Zoho'; }})); tb.querySelectorAll('[data-reject]').forEach(b=> b.addEventListener('click', async()=>{ const reason=prompt('Reject reason (optional)')||''; try{ await apiFetch('/api/item-master/pending-requests/'+b.dataset.reject+'/reject',{method:'POST', body: JSON.stringify({reason})}); loadPending(); }catch(e){ alert(e.message); }})); }catch(e){ $('#pending-status-txt').textContent=e.message; } }
$('#btn-pending').addEventListener('click', loadPending);
$('#btn-new-req').addEventListener('click', ()=> $('#dlg-new-req').showModal());
$('#btn-cancel-req').addEventListener('click', ()=> $('#dlg-new-req').close());
document.querySelector('#dlg-new-req form').addEventListener('submit', async (e)=>{ e.preventDefault(); const body={brand:$('#req-brand').value.trim(), category:$('#req-category').value.trim(), category_code:$('#req-catcode').value.trim(), pack_size:$('#req-pack').value.trim(), product_name:$('#req-pname').value.trim(), base_type:$('#req-base').value.trim()||null, color:$('#req-color').value.trim()||null, dpl: Number($('#req-dpl').value), unit:$('#req-unit').value.trim()||'nos', description:$('#req-desc').value.trim()||null}; if(!body.brand||!body.category||!body.category_code||!body.pack_size||!body.product_name||!body.dpl) { $('#req-msg').textContent='Fill required fields'; return; } $('#req-msg').textContent='Submitting…'; try{ await apiFetch('/api/item-master/pending-requests',{method:'POST', body: JSON.stringify(body)}); $('#req-msg').textContent='Submitted for admin approval'; setTimeout(()=>{ $('#dlg-new-req').close(); $('#req-msg').textContent=''; loadPending(); }, 600); }catch(err){ $('#req-msg').textContent=err.message; } });
$('#btn-refresh').addEventListener('click', ()=>{const t=document.querySelector('.qc-hub-tab.active').dataset.tab; if(t==='products') loadProd(); if(t==='brands') loadBrands(); if(t==='categories') loadCats(); if(t==='master') loadMaster(); if(t==='pending') loadPending();});
loadProd();
</script>
</body>
</html>
