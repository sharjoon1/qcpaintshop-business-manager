<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalog Hub — Quality Colours Manager</title>
<link rel="stylesheet" href="/css/tailwind.css?v=849f1b5c">
<link rel="stylesheet" href="/css/design-system.css">
<link rel="stylesheet" href="/css/qc-ui.css">
<style>
:root{--hub-accent:#0F3A5F}
.qc-hub-tabs{display:flex;gap:.25rem;overflow-x:auto;padding:.5rem 0;border-bottom:1px solid #e5e7eb}
.qc-hub-tab{white-space:nowrap;padding:.6rem 1rem;border-radius:8px 8px 0 0;font-weight:600;font-size:.85rem;color:#64748b;border:1px solid transparent;border-bottom:none;cursor:pointer;background:#f8fafc}
.qc-hub-tab.active{background:#fff;color:var(--hub-accent);border-color:#e5e7eb}
.qc-hub-panel{display:none}.qc-hub-panel.active{display:block}
.qc-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:1rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-page="products" class="bg-gray-50">
<div id="universal-nav-placeholder"></div>
<div id="subnav-placeholder"></div>
<main class="max-w-7xl mx-auto px-4 py-6">
  <header class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div><h1 class="text-xl font-bold text-slate-900">Catalog Hub</h1><p class="text-sm text-slate-500">Products · Brands · Categories · Item Master</p></div>
    <div class="flex gap-2"><button id="btn-refresh" class="px-3 py-2 rounded-lg border bg-white text-sm">Refresh</button><a href="/admin-products.html" class="px-3 py-2 rounded-lg text-white text-sm" style="background:var(--gradient-primary)">Products</a></div>
  </header>
  <div class="qc-hub-tabs" role="tablist">
    <button class="qc-hub-tab active" data-tab="products" role="tab" aria-selected="true">Products</button>
    <button class="qc-hub-tab" data-tab="brands" role="tab">Brands</button>
    <button class="qc-hub-tab" data-tab="categories" role="tab">Categories</button>
    <button class="qc-hub-tab" data-tab="master" role="tab">Item Master</button>
  </div>

  <section id="panel-products" class="qc-hub-panel active">
    <div class="qc-card mt-4">
      <div class="flex gap-2 mb-3"><input id="prod-q" placeholder="Search products…" class="border rounded-lg px-3 py-2 text-sm w-64"><button id="btn-prod" class="px-3 py-2 rounded-lg text-white text-sm" style="background:#0F3A5F">Search</button><span id="prod-status" class="text-sm text-slate-500 self-center"></span></div>
      <div id="prod-empty" class="hidden text-sm text-slate-500 py-8 text-center">No products.</div>
      <table class="w-full text-sm"><thead class="text-slate-500"><tr><th class="text-left p-2">Name</th><th class="text-left p-2">Brand</th><th class="text-left p-2">Category</th></tr></thead><tbody id="prod-body"></tbody></table>
    </div>
  </section>
  <section id="panel-brands" class="qc-hub-panel">
    <div class="qc-card mt-4">
      <div class="flex gap-2 mb-3"><button id="btn-brands" class="px-3 py-2 rounded-lg text-white text-sm" style="background:#0F3A5F">Load brands</button><span id="brands-status" class="text-sm text-slate-500 self-center"></span></div>
      <div id="brands-empty" class="hidden text-sm text-slate-500 py-8 text-center">No brands.</div>
      <table class="w-full text-sm"><thead class="text-slate-500"><tr><th class="text-left p-2">Brand</th><th class="text-left p-2">Products</th></tr></thead><tbody id="brands-body"></tbody></table>
    </div>
  </section>
  <section id="panel-categories" class="qc-hub-panel">
    <div class="qc-card mt-4">
      <div class="flex gap-2 mb-3"><button id="btn-cats" class="px-3 py-2 rounded-lg text-white text-sm" style="background:#0F3A5F">Load categories</button><span id="cats-status" class="text-sm text-slate-500 self-center"></span></div>
      <div id="cats-empty" class="hidden text-sm text-slate-500 py-8 text-center">No categories.</div>
      <table class="w-full text-sm"><thead class="text-slate-500"><tr><th class="text-left p-2">Category</th><th class="text-left p-2">Products</th></tr></thead><tbody id="cats-body"></tbody></table>
    </div>
  </section>
  <section id="panel-master" class="qc-hub-panel">
    <div class="qc-card mt-4">
      <div class="flex gap-2 mb-3"><input id="master-q" placeholder="Search item master…" class="border rounded-lg px-3 py-2 text-sm w-64"><button id="btn-master" class="px-3 py-2 rounded-lg text-white text-sm" style="background:#0F3A5F">Search</button><span id="master-status" class="text-sm text-slate-500 self-center"></span></div>
      <div id="master-empty" class="hidden text-sm text-slate-500 py-8 text-center">No items.</div>
      <table class="w-full text-sm"><thead class="text-slate-500"><tr><th class="text-left p-2">Item</th><th class="text-left p-2">SKU</th><th class="text-right p-2">Rate</th></tr></thead><tbody id="master-body"></tbody></table>
      <a href="/admin-item-master.html" class="inline-block mt-3 text-sm text-blue-600">Open Item Master →</a>
    </div>
  </section>
</main>
<script src="/universal-nav-loader.js?v=6b4a6dbe"></script>
<script>
const $=s=>document.querySelector(s);
function getAuthHeaders(){const t=localStorage.getItem('auth_token')||localStorage.getItem('token')||'';return t?{Authorization:'Bearer '+t}:{}}
async function apiFetch(url,opts={}){const h={...getAuthHeaders(), ...(opts.headers||{})}; if(opts.body && !(opts.body instanceof FormData) && !h['Content-Type']) h['Content-Type']='application/json'; const r=await fetch(url,{...opts,headers:h}); if(r.status===401){location.href='/login.html'; throw new Error('Auth');} if(!r.ok) throw new Error((await r.text()).slice(0,300)); return r.json();}
function esc(s){const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML;}
function setTab(n){document.querySelectorAll('.qc-hub-tab').forEach(b=>{const on=b.dataset.tab===n; b.classList.toggle('active',on); b.setAttribute('aria-selected',String(on));}); document.querySelectorAll('.qc-hub-panel').forEach(p=> p.classList.toggle('active', p.id==='panel-'+n)); history.replaceState(null,'','#'+n);}
document.querySelectorAll('.qc-hub-tab').forEach(b=> b.addEventListener('click',()=> setTab(b.dataset.tab)));
if(location.hash) setTab(location.hash.slice(1));
async function loadProd(){const q=$('#prod-q').value.trim(); $('#prod-status').textContent='Loading…'; try{const qs=new URLSearchParams(); if(q) qs.set('q',q); qs.set('limit','20'); const j=await apiFetch('/api/products?'+qs.toString()); const rows=j.data||j.products||j.rows||[]; const tb=$('#prod-body'); tb.innerHTML=''; if(!rows.length) $('#prod-empty').classList.remove('hidden'); else $('#prod-empty').classList.add('hidden'); rows.forEach(r=>{const tr=document.createElement('tr'); tr.className='border-t'; tr.innerHTML=`<td class="p-2">${esc(r.name||'')}</td><td class="p-2">${esc(r.brand||r.brand_name||'')}</td><td class="p-2">${esc(r.category||r.category_name||'')}</td>`; tb.appendChild(tr);}); $('#prod-status').textContent=rows.length+' rows';}catch(e){$('#prod-status').textContent=e.message;}}
async function loadBrands(){ $('#brands-status').textContent='Loading…'; try{const j=await apiFetch('/api/brands'); const rows=j.data||j.brands||j.rows||[]; const tb=$('#brands-body'); tb.innerHTML=''; if(!rows.length) $('#brands-empty').classList.remove('hidden'); else $('#brands-empty').classList.add('hidden'); rows.forEach(r=>{const tr=document.createElement('tr'); tr.className='border-t'; tr.innerHTML=`<td class="p-2">${esc(r.name||'')}</td><td class="p-2">${esc(String(r.product_count??''))}</td>`; tb.appendChild(tr);}); $('#brands-status').textContent=rows.length+' rows';}catch(e){$('#brands-status').textContent=e.message;}}
async function loadCats(){ $('#cats-status').textContent='Loading…'; try{const j=await apiFetch('/api/categories'); const rows=j.data||j.categories||j.rows||[]; const tb=$('#cats-body'); tb.innerHTML=''; if(!rows.length) $('#cats-empty').classList.remove('hidden'); else $('#cats-empty').classList.add('hidden'); rows.forEach(r=>{const tr=document.createElement('tr'); tr.className='border-t'; tr.innerHTML=`<td class="p-2">${esc(r.name||'')}</td><td class="p-2">${esc(String(r.product_count??''))}</td>`; tb.appendChild(tr);}); $('#cats-status').textContent=rows.length+' rows';}catch(e){$('#cats-status').textContent=e.message;}}
async function loadMaster(){const q=$('#master-q').value.trim(); $('#master-status').textContent='Loading…'; try{const qs=new URLSearchParams(); if(q) qs.set('q',q); qs.set('limit','20'); const j=await apiFetch('/api/item-master?'+qs.toString()); const rows=j.data||j.items||j.rows||[]; const tb=$('#master-body'); tb.innerHTML=''; if(!rows.length) $('#master-empty').classList.remove('hidden'); else $('#master-empty').classList.add('hidden'); rows.forEach(r=>{const tr=document.createElement('tr'); tr.className='border-t'; tr.innerHTML=`<td class="p-2">${esc(r.name||r.item_name||'')}</td><td class="p-2">${esc(r.sku||r.item_sku||'')}</td><td class="p-2 text-right">₹${Number(r.rate||r.price||0).toLocaleString('en-IN')}</td>`; tb.appendChild(tr);}); $('#master-status').textContent=rows.length+' rows';}catch(e){$('#master-status').textContent=e.message;}}
$('#btn-prod').addEventListener('click', loadProd);
$('#btn-brands').addEventListener('click', loadBrands);
$('#btn-cats').addEventListener('click', loadCats);
$('#btn-master').addEventListener('click', loadMaster);
$('#btn-refresh').addEventListener('click', ()=>{const t=document.querySelector('.qc-hub-tab.active').dataset.tab; if(t==='products') loadProd(); if(t==='brands') loadBrands(); if(t==='categories') loadCats(); if(t==='master') loadMaster();});
loadProd();
</script>
</body>
</html>
