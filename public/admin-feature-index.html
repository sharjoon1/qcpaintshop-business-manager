<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F3A5F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <title>Feature Index - Quality Colours Business Manager</title>
    <script src="/js/auth-helper.js?v=7101c516"></script>
    <script src="/js/pages/admin-feature-index-authguard.js"></script>
    <link rel="stylesheet" href="/css/tailwind.css?v=849f1b5c">
    <link rel="stylesheet" href="/css/design-system.css?v=16beaa3b">
    <script src="/universal-nav-loader.js?v=6b4a6dbe"></script>
    <style>
        .fi-chip {
            display: inline-flex; align-items: center; gap: 0.375rem;
            padding: 0.375rem 0.875rem; border-radius: 9999px;
            font-size: 0.8125rem; font-weight: 600; cursor: pointer;
            border: 1px solid #e5e7eb; background: #ffffff; color: #4b5563;
            transition: all 0.15s ease;
        }
        .fi-chip:hover { background: #f9fafb; }
        .fi-chip.active { background: #4f46e5; border-color: #4f46e5; color: #ffffff; }
        .fi-chip .fi-chip-count { opacity: 0.75; font-weight: 500; }

        .fi-type-badge {
            display: inline-flex; align-items: center; padding: 0.125rem 0.5rem;
            border-radius: 9999px; font-size: 0.6875rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.4;
            white-space: nowrap;
        }
        .fi-type-page { background: #e0e7ff; color: #3730a3; }
        .fi-type-section { background: #dbeafe; color: #1e40af; }
        .fi-type-feature { background: #d1fae5; color: #065f46; }
        .fi-type-button { background: #fef3c7; color: #92400e; }
        .fi-type-tab { background: #ede9fe; color: #5b21b6; }
        .fi-type-field { background: #f3f4f6; color: #374151; }
        .fi-type-state { background: #ffe4e6; color: #9f1239; }

        .fi-page-group { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 1rem; overflow: hidden; }
        .fi-page-group-header {
            display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
            padding: 0.75rem 1.125rem; background: #f9fafb; border-bottom: 1px solid #e5e7eb;
        }
        .fi-page-group-title { font-weight: 700; color: #1f2937; font-size: 0.9375rem; }
        .fi-page-group-meta { font-size: 0.75rem; color: #6b7280; }

        .fi-row { border-bottom: 1px solid #f3f4f6; }
        .fi-row:last-child { border-bottom: none; }
        .fi-row-main {
            display: flex; align-items: flex-start; gap: 0.75rem;
            padding: 0.75rem 1.125rem; cursor: pointer;
        }
        .fi-row-main:hover { background: #f9fafb; }
        .fi-row-id { font-size: 0.75rem; color: #9ca3af; font-weight: 600; min-width: 2.75rem; padding-top: 0.125rem; }
        .fi-row-body { flex: 1; min-width: 0; }
        .fi-row-title { font-weight: 600; color: #1f2937; font-size: 0.875rem; }
        .fi-row-does { color: #6b7280; font-size: 0.8125rem; margin-top: 0.125rem; }
        .fi-row-detail { display: none; padding: 0 1.125rem 1rem 4.5rem; }
        .fi-row-detail.open { display: block; }
        .fi-detail-item { font-size: 0.8125rem; color: #374151; margin-bottom: 0.375rem; }
        .fi-detail-item b { color: #111827; font-weight: 600; margin-right: 0.375rem; }
        .fi-detail-item code { background: #f3f4f6; padding: 0.0625rem 0.375rem; border-radius: 4px; font-size: 0.75rem; }
        .fi-copy-btn {
            font-size: 0.75rem; font-weight: 600; color: #4f46e5; background: #eef2ff;
            border: none; border-radius: 6px; padding: 0.25rem 0.625rem; cursor: pointer; margin-top: 0.375rem;
        }
        .fi-copy-btn:hover { background: #e0e7ff; }
        .fi-copy-btn.copied { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body class="bg-gray-50 sidebar-collapsed" data-page="feature-index">
<div class="max-w-6xl mx-auto p-4 sm:p-6">

    <div class="page-header rounded-xl mb-6">
        <h1 class="page-title">Feature Index</h1>
        <p class="page-subtitle">Every screen and major UI element, cross-referenced to code, API, and design. IDs are stable and never renumbered.</p>
    </div>

    <div class="qc-card qc-card-sm mb-6">
        <div class="flex flex-col sm:flex-row gap-3 sm:items-center mb-3">
            <input type="text" id="searchInput" placeholder="Search title, does, code, api… (try #12 or 12 for an id)"
                   class="flex-1 px-4 py-2 border-2 border-gray-300 rounded-lg text-sm focus:border-indigo-500 focus:outline-none">
            <span id="resultCount" class="text-sm text-gray-500 whitespace-nowrap"></span>
        </div>
        <div id="platformChips" class="flex flex-wrap gap-2"></div>
    </div>

    <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <p class="loading-text">Loading feature index…</p>
    </div>

    <div id="emptyState" class="empty-state hidden">
        <h3 class="empty-state-title">No matching entries</h3>
        <p class="empty-state-description">Try a different search term or clear the platform filter.</p>
    </div>

    <div id="resultsContainer" class="hidden"></div>

</div>
<script src="/js/pages/admin-feature-index.js"></script>
</body>
</html>
